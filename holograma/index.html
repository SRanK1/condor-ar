<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Cóndor Andino · Holograma</title>
  <meta name="description" content="Un cóndor andino en 3D vuela en círculos sobre la imagen de tu cámara.">
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#fff; touch-action:none; }
    body.sin-camara { background: radial-gradient(90% 60% at 50% 65%, #34465c 0%, #141b24 60%, #07090c 100%); }
    #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
    #lienzo { position:fixed; inset:0; width:100%; height:100%; display:block; }
    .titulo { position:fixed; left:0; right:0; top: max(14px, env(safe-area-inset-top)); text-align:center; font-weight:800;
      letter-spacing:.05em; font-size:18px; text-shadow:0 2px 10px rgba(0,0,0,.6); pointer-events:none; }
    #estado { position:fixed; left:16px; right:16px; top:45%; text-align:center; font-size:16px; text-shadow:0 2px 8px rgba(0,0,0,.8); }
    body.listo #estado:not(.error) { display:none; }
    #estado.error { background:rgba(0,0,0,.6); padding:12px; border-radius:12px; }
    #toque { position:fixed; left:50%; bottom: max(70px, calc(env(safe-area-inset-bottom) + 56px)); transform:translateX(-50%);
      background:rgba(0,0,0,.55); padding:10px 16px; border-radius:14px; font-size:14px; text-align:center; width:max-content; max-width:88%; }
    .completo { position:fixed; left:50%; bottom: max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%);
      color:#fff; font-size:13px; opacity:.85; background:rgba(0,0,0,.4); padding:7px 14px; border-radius:999px; text-decoration:none; white-space:nowrap; }
    .creditos { position:fixed; right:8px; bottom:2px; font-size:9px; opacity:.6; }
    .creditos a { color:inherit; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="lienzo"></canvas>
  <div class="titulo">🦅 CÓNDOR ANDINO</div>
  <div id="estado">Abriendo la cámara…</div>
  <div id="toque" hidden>Toca la pantalla para que el cóndor se quede fijo al mover el teléfono</div>
  <a class="completo" href="../">Caminar a su alrededor (AR completo)</a>
  <script type="module" src="app.js"></script>
</body>
</html>
